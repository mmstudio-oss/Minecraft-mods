name: Build Javelin mod JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Unpack mod source archive
        run: |
          test -f Javelin_FGM148_Forge_1.20.1_v1.1_source.zip || { echo 'Upload Javelin_FGM148_Forge_1.20.1_v1.1_source.zip to the repository first'; exit 1; }
          unzip -oq Javelin_FGM148_Forge_1.20.1_v1.1_source.zip
      - name: Apply Javelin 1.2 visuals and directional impact
        run: |
          tar -xzf overrides/v12_patch.tar.gz -C overrides
          python3 overrides/apply_v12.py
      - name: Check assets
        working-directory: JavelinForge1201
        run: python3 verify_assets.py
      - name: Compile Forge mod
        working-directory: JavelinForge1201
        run: gradle build --no-daemon --stacktrace
      - name: Upload real mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Javelin-Forge-1.20.1-JAR
          path: JavelinForge1201/build/libs/javelin-*.jar
          if-no-files-found: error
      - name: Prepare standalone JAR
        run: |
          cp JavelinForge1201/build/libs/javelin-*.jar Javelin-Forge-1.20.1-v1.2.0.jar
      - name: Publish direct-download GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view javelin-1.2.0 >/dev/null 2>&1; then
            gh release upload javelin-1.2.0 Javelin-Forge-1.20.1-v1.2.0.jar --clobber
          else
            gh release create javelin-1.2.0 Javelin-Forge-1.20.1-v1.2.0.jar --title 'Javelin 1.2.0 — Forge 1.20.1' --notes 'New pixel model, slender rocket, 2x2 cross section and 5 block directional penetration. Forge 47.4.x, Java 17.' --target main
          fi
