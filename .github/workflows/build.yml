name: Build Javelin mod JAR
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Unpack Javelin sources and generate Minecraft artwork
        run: |
          tar xzf javelin-source.tar.gz
          python3 -m pip install --quiet Pillow
          python3 generate_assets.py
      - name: Build with ForgeGradle
        run: gradle build --no-daemon --stacktrace
      - name: Upload real mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Javelin-Forge-1.20.1-JAR
          path: build/libs/javelin-*.jar
          if-no-files-found: error
